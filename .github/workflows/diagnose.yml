name: Diagnose NetHome Plus appliance fields

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run diagnostic script
        env:
          MIDEA_ACCOUNT: ${{ secrets.MIDEA_ACCOUNT }}
          MIDEA_PASSWORD: ${{ secrets.MIDEA_PASSWORD }}
        run: python diagnose.py
