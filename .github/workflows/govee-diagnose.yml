name: Diagnose Govee sensor fields

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run Govee diagnostic script
        env:
          GOVEE_API_KEY: ${{ secrets.GOVEE_API_KEY }}
        run: python govee_diagnose.py
