name: Humidity-controlled AC automation

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  automate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install requests

      # ------------------------------------------------------------------
      # Cycle 1
      # ------------------------------------------------------------------
      - name: Run automation (cycle 1)
        id: run1
        env:
          GOVEE_API_KEY: ${{ secrets.GOVEE_API_KEY }}
          MIDEA_ACCOUNT: ${{ secrets.MIDEA_ACCOUNT }}
          MIDEA_PASSWORD: ${{ secrets.MIDEA_PASSWORD }}
          HUMIDITY_TRIGGER: ${{ vars.HUMIDITY_TRIGGER }}
          MAX_TEMP_ALERT_F: ${{ vars.MAX_TEMP_ALERT_F }}
          DESIRED_ROOM_TEMP_F: ${{ vars.DESIRED_ROOM_TEMP_F }}
          MAINTENANCE_START: ${{ vars.MAINTENANCE_START }}
          MAINTENANCE_END: ${{ vars.MAINTENANCE_END }}
          GIVE_AUTO_PRIORITY: "true"
        run: python automate.py

      - name: Email status (cycle 1 - pausing 10 min)
        if: >-
          always() && steps.run1.outputs.humidity != '' &&
          (vars.EMAIL_NOTIFICATIONS == 'All' ||
           (vars.EMAIL_NOTIFICATIONS == 'Action' && steps.run1.outputs.action_occurred == 'true') ||
           steps.run1.outputs.high_temp_alert == 'true')
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "${{ steps.run1.outputs.high_temp_alert == 'true' && '⚠️ HIGH TEMP — ' || '' }}AC automation (cycle 1, pausing 10 min): ${{ steps.run1.outputs.action }} (${{ steps.run1.outputs.humidity }}%)"
          to: ${{ secrets.MAIL_USERNAME }}
          from: NetHome Automation
          body: |
            Cycle 1 of 2 complete — pausing 10 minutes before the second check.

            High-temp alert: ${{ steps.run1.outputs.alert_message }} (limit ${{ vars.MAX_TEMP_ALERT_F }}°F)

            Humidity: ${{ steps.run1.outputs.humidity }}% (trigger: ${{ steps.run1.outputs.humidity_trigger }}%)
            Govee temp: ${{ steps.run1.outputs.govee_temp_f }}°F (desired: ${{ steps.run1.outputs.desired_temp_f }}°F)
            Action: ${{ steps.run1.outputs.action }}

            AC state:
              mode: ${{ steps.run1.outputs.mode }} (${{ steps.run1.outputs.mode_name }})
              running: ${{ steps.run1.outputs.running }}
              current indoor temp (AC unit): ${{ steps.run1.outputs.ac_indoor_f }}°F
              target temperature: ${{ steps.run1.outputs.target }} (${{ steps.run1.outputs.target_f }}F)
              fan speed: ${{ steps.run1.outputs.fan }}

      - name: Maintenance window skip email (cycle 1)
        if: always() && steps.run1.outputs.maintenance_skipped == 'true' && vars.EMAIL_NOTIFICATIONS == 'All'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "AC automation (cycle 1): skipped — inside maintenance window"
          to: ${{ secrets.MAIL_USERNAME }}
          from: NetHome Automation
          body: |
            Cycle 1 skipped entirely — current time is inside the maintenance
            window (${{ vars.MAINTENANCE_START }} - ${{ vars.MAINTENANCE_END }} Pacific Time).

      - name: Pause 10 minutes before second check
        run: sleep 600

      # ------------------------------------------------------------------
      # Cycle 2
      # ------------------------------------------------------------------
      - name: Run automation (cycle 2)
        id: run2
        env:
          GOVEE_API_KEY: ${{ secrets.GOVEE_API_KEY }}
          MIDEA_ACCOUNT: ${{ secrets.MIDEA_ACCOUNT }}
          MIDEA_PASSWORD: ${{ secrets.MIDEA_PASSWORD }}
          HUMIDITY_TRIGGER: ${{ vars.HUMIDITY_TRIGGER }}
          MAX_TEMP_ALERT_F: ${{ vars.MAX_TEMP_ALERT_F }}
          DESIRED_ROOM_TEMP_F: ${{ vars.DESIRED_ROOM_TEMP_F }}
          MAINTENANCE_START: ${{ vars.MAINTENANCE_START }}
          MAINTENANCE_END: ${{ vars.MAINTENANCE_END }}
          GIVE_AUTO_PRIORITY: "false"
        run: python automate.py

      - name: Email status (cycle 2 - completion)
        if: >-
          always() && steps.run2.outputs.humidity != '' &&
          (vars.EMAIL_NOTIFICATIONS == 'All' ||
           (vars.EMAIL_NOTIFICATIONS == 'Action' && steps.run2.outputs.action_occurred == 'true') ||
           steps.run2.outputs.high_temp_alert == 'true')
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "${{ steps.run2.outputs.high_temp_alert == 'true' && '⚠️ HIGH TEMP — ' || '' }}AC automation (cycle 2, complete): ${{ steps.run2.outputs.action }} (${{ steps.run2.outputs.humidity }}%)"
          to: ${{ secrets.MAIL_USERNAME }}
          from: NetHome Automation
          body: |
            Cycle 2 of 2 complete — this workflow run is finished.

            High-temp alert: ${{ steps.run2.outputs.alert_message }} (limit ${{ vars.MAX_TEMP_ALERT_F }}°F)

            Humidity: ${{ steps.run2.outputs.humidity }}% (trigger: ${{ steps.run2.outputs.humidity_trigger }}%)
            Govee temp: ${{ steps.run2.outputs.govee_temp_f }}°F (desired: ${{ steps.run2.outputs.desired_temp_f }}°F)
            Action: ${{ steps.run2.outputs.action }}

            AC state:
              mode: ${{ steps.run2.outputs.mode }} (${{ steps.run2.outputs.mode_name }})
              running: ${{ steps.run2.outputs.running }}
              current indoor temp (AC unit): ${{ steps.run2.outputs.ac_indoor_f }}°F
              target temperature: ${{ steps.run2.outputs.target }} (${{ steps.run2.outputs.target_f }}F)
              fan speed: ${{ steps.run2.outputs.fan }}

      - name: Maintenance window skip email (cycle 2)
        if: always() && steps.run2.outputs.maintenance_skipped == 'true' && vars.EMAIL_NOTIFICATIONS == 'All'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "AC automation (cycle 2): skipped — inside maintenance window"
          to: ${{ secrets.MAIL_USERNAME }}
          from: NetHome Automation
          body: |
            Cycle 2 skipped entirely — current time is inside the maintenance
            window (${{ vars.MAINTENANCE_START }} - ${{ vars.MAINTENANCE_END }} Pacific Time).
