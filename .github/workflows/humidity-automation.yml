name: Humidity-controlled AC automation

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  automate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install requests

      - name: Run automation
        id: run
        env:
          GOVEE_API_KEY: ${{ secrets.GOVEE_API_KEY }}
          MIDEA_ACCOUNT: ${{ secrets.MIDEA_ACCOUNT }}
          MIDEA_PASSWORD: ${{ secrets.MIDEA_PASSWORD }}
          HUMIDITY_TRIGGER: ${{ vars.HUMIDITY_TRIGGER }}
          HUMIDITY_RESET: ${{ vars.HUMIDITY_RESET }}
          MAX_TEMP_ALERT_F: ${{ vars.MAX_TEMP_ALERT_F }}
          DESIRED_ROOM_TEMP_F: ${{ vars.DESIRED_ROOM_TEMP_F }}
        run: python automate.py

      - name: Email status
        if: >-
          always() && steps.run.outputs.humidity != '' &&
          (vars.EMAIL_NOTIFICATIONS == 'All' ||
           (vars.EMAIL_NOTIFICATIONS == 'Action' &&
            (steps.run.outputs.action_occurred == 'true' || steps.run.outputs.temp_action_occurred == 'true')))
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "AC automation: ${{ steps.run.outputs.action }} (${{ steps.run.outputs.humidity }}%)"
          to: ${{ secrets.MAIL_USERNAME }}
          from: NetHome Automation
          body: |
            Humidity: ${{ steps.run.outputs.humidity }}%
            Action (humidity/dry mode): ${{ steps.run.outputs.action }}
            Thresholds used: trigger=${{ steps.run.outputs.trigger }}% reset=${{ steps.run.outputs.reset }}%

            Action (temp/auto mode): ${{ steps.run.outputs.temp_action }}
            Desired room temp: ${{ steps.run.outputs.desired_temp_f }}°F (restores below ${{ steps.run.outputs.temp_reset_f }}°F)

            AC state:
              mode: ${{ steps.run.outputs.mode }} (${{ steps.run.outputs.mode_name }})
              running: ${{ steps.run.outputs.running }}
              current indoor temp (Govee): ${{ steps.run.outputs.govee_temp_f }}°F
              current indoor temp (AC unit): ${{ steps.run.outputs.ac_indoor_f }}°F
              target temperature: ${{ steps.run.outputs.target }} (${{ steps.run.outputs.target_f }}F)
              fan speed: ${{ steps.run.outputs.fan }}

      - name: High temperature alert email
        if: always() && steps.run.outputs.high_temp_alert == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "⚠️ AC automation: HIGH TEMPERATURE ALERT (${{ steps.run.outputs.alert_message }})"
          to: ${{ secrets.MAIL_USERNAME }}
          from: NetHome Automation
          body: |
            Room temperature exceeded ${{ vars.MAX_TEMP_ALERT_F }}°F.

            Triggered by: ${{ steps.run.outputs.alert_message }}

            Govee sensor: ${{ steps.run.outputs.govee_temp_f }}°F
            AC unit sensor: ${{ steps.run.outputs.ac_indoor_f }}°F

            AC state:
              mode: ${{ steps.run.outputs.mode }} (${{ steps.run.outputs.mode_name }})
              running: ${{ steps.run.outputs.running }}
              target temperature: ${{ steps.run.outputs.target }} (${{ steps.run.outputs.target_f }}F)

      - name: Commit state.json if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A state.json temp_state.json
            git commit -m "Update saved AC state [skip ci]"
            git push
          else
            echo "No change to state.json"
          fi
